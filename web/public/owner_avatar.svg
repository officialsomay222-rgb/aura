<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="#09090b" stroke="url(#bgGrad)" stroke-width="6" />
  
  <!-- Ambient Glow Inner -->
  <circle cx="100" cy="100" r="86" fill="url(#glowGrad)" />

  <!-- Stylized DJ / Music Producer Head Silhouette -->
  <!-- Shoulders -->
  <path d="M 46 172 C 50 142, 75 130, 100 130 C 125 130, 150 142, 154 172 Z" fill="#18181b" stroke="#6366f1" stroke-width="2" />
  
  <!-- Neck -->
  <rect x="91" y="112" width="18" height="24" rx="6" fill="#27272a" />
  
  <!-- Head -->
  <circle cx="100" cy="94" r="28" fill="#27272a" stroke="#818cf8" stroke-width="2" />
  <path d="M 85 86 C 85 86, 92 84, 100 84 C 108 84, 115 86, 115 86" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" />
  
  <!-- Stylish Shades -->
  <path d="M 82 92 C 82 90, 88 88, 97 88 L 100 89 L 103 88 C 112 88, 118 90, 118 92 C 118 98, 110 102, 103 102 C 100 102, 99 101, 97 101 C 90 101, 82 98, 82 92 Z" fill="#09090b" stroke="#ec4899" stroke-width="2" />
  <line x1="86" y1="94" x2="94" y2="94" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="106" y1="94" x2="114" y2="94" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />

  <!-- Headphones Band -->
  <path d="M 64 94 C 64 66, 80 50, 100 50 C 120 50, 136 66, 136 94" fill="none" stroke="url(#bgGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Headphone Ear Cups -->
  <rect x="58" y="80" width="14" height="30" rx="7" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
  <rect x="128" y="80" width="14" height="30" rx="7" fill="#ec4899" stroke="#ffffff" stroke-width="2" />

  <!-- Sound Waves / Crown Accents -->
  <path d="M 90 38 L 95 44 L 100 34 L 105 44 L 110 38" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing DJ Pulse Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
</svg>
